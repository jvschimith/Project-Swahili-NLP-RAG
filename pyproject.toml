[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swahili-linguistic-intelligence"
version = "2.1.1a0"
description = "Research toolkit and API for Swahili lexical and morphological analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Swahili",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "loguru>=0.7,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
web = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.9,<1",
  "requests>=2.31,<3",
  "uvicorn>=0.30,<1",
]
dashboard = ["plotly>=5.18,<7", "streamlit>=1.31,<2"]
research = [
  "datasets>=2.16,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.3,<2",
  "transformers>=4.36,<6",
]
dev = [
  "black>=24,<27",
  "flake8>=7,<8",
  "isort>=5,<9",
  "mypy>=1.8,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-mock>=3.12,<4",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

